# Tự build APK mỗi lần đẩy code, rồi đặt vào Release "apk" để tải thẳng trên điện thoại:
# https://github.com/chutich3344/EVCarHUD_Android/releases/download/apk/EVCarHUD.apk
# APK không kèm model (nhẹ, tải được bằng điện thoại): lần đầu mở app tự tải model từ Release "models" (ModelFiles.kt).
name: Build APK

on:
  push:
    branches: [main, claude/hud-layout, claude/project-thread-uxds1h, claude/project-thread-mx3u0m]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_PLAY_KEY: ${{ secrets.PLAY_KEY_PASS != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Đưa APK lên Release "apk"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk EVCarHUD.apk
          NOTE="Bản build từ nhánh ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}, lúc $(TZ=Asia/Ho_Chi_Minh date '+%H:%M %d/%m/%Y')"
          # Bản gọi HERE qua Worker đăng riêng ở Release "apk-worker" cho tới khi Worker chạy ổn
          TAG=apk; TITLE="APK mới nhất"
          if [ "$GITHUB_REF_NAME" = "claude/project-thread-uxds1h" ]; then TAG=apk-worker; TITLE="APK thử máy chủ Worker"; fi
          # Bản thử màn hình Android Auto
          if [ "$GITHUB_REF_NAME" = "claude/project-thread-mx3u0m" ]; then TAG=apk-auto; TITLE="APK thử Android Auto"; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTE"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTE" --prerelease
          fi
          gh release upload "$TAG" EVCarHUD.apk --repo "$GITHUB_REPOSITORY" --clobber

      # Bản cho Google Play (thử nghiệm nội bộ): chỉ chạy khi đã thêm secret PLAY_KEYSTORE_B64 và PLAY_KEY_PASS
      - name: Build AAB cho Google Play
        env:
          PLAY_KEYSTORE_B64: ${{ secrets.PLAY_KEYSTORE_B64 }}
          PLAY_KEY_PASS: ${{ secrets.PLAY_KEY_PASS }}
          GH_TOKEN: ${{ github.token }}
        if: env.HAS_PLAY_KEY == 'true'
        run: |
          echo "$PLAY_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export PLAY_KEYSTORE="$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab EVCarHUD.aab
          TAG=aab
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "AAB cho Google Play" --notes "Tải lên Play Console" --prerelease
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "Bản ${GITHUB_RUN_NUMBER} từ nhánh ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}"
          gh release upload "$TAG" EVCarHUD.aab --repo "$GITHUB_REPOSITORY" --clobber
